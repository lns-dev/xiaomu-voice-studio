name: Windows release gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Run unit and contract tests
        run: pnpm test
      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem electron,scripts,tests -Recurse -Include *.cjs,*.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate bundled release tool
        run: pnpm validate:release-tool
      - name: Build unsigned Windows Beta installer
        run: pnpm dist:win
      - name: Smoke test exact packaged application
        run: pnpm smoke:packaged
